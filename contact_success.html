<!DOCTYPE html>
<html lang="en">
<head>

    <title>Message Sent | Stellar Web Studio</title>
    <link rel="icon" type="image/svg+xml" href="IMAGES/favicon stellar web studio.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="status-page">

    <div class="status-card">

        <div class="status-icon success">
            ✓
        </div>

        <p class="status-label">
            MESSAGE SENT
        </p>

        <h1>
            Thank You!
        </h1>

        <p class="status-text">
            Your message has been successfully sent. We’ve received your enquiry
            and will get back to you as soon as possible.
        </p>

        <p class="status-text">
            We typically reply within 24 hours. Keep an eye on your inbox
            (and spam folder, just in case).
        </p>

        <div class="status-buttons">

            <a href="index.html" class="btn-order">
                Back to Home
            </a>

            <a href="templates.html" class="btn-preview">
                Browse Templates
            </a>

        </div>

    </div>

</section>

</html>

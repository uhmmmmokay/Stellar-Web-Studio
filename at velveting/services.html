<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
        }

        .tail-container { font-family: var(--font-body); }
        .heading-font { font-family: var(--font-heading); }

        .bg-page { background-color: var(--bg-color) !important; }
        .bg-page-alt { background-color: var(--bg-alt) !important; }
        .bg-card { background-color: var(--card-bg) !important; }
        .bg-nav { background-color: var(--nav-bg) !important; }
        .bg-footer { background-color: var(--footer-bg) !important; }

        .bg-primary { background-color: var(--primary) !important; }
        .bg-primary-dark { background-color: var(--primary-dark) !important; }
        .bg-primary-light { background-color: var(--primary-light) !important; }
        .bg-primary-50 { background-color: var(--primary-50) !important; }
        .text-primary { color: var(--primary) !important; }
        .border-primary { border-color: var(--primary) !important; }
        .hover\:bg-primary-dark:hover { background-color: var(--primary-dark) !important; }
        .hover\:bg-primary:hover { background-color: var(--primary) !important; }
        .hover\:text-primary:hover { color: var(--primary) !important; }
        .hover\:bg-primary-50:hover { background-color: var(--primary-50) !important; }
        .hover\:text-white:hover { color: #fff !important; }

        .text-main { color: var(--text-color) !important; }
        .text-muted { color: var(--text-muted) !important; }
        .text-footer { color: var(--footer-text) !important; }
        .text-footer-muted { color: var(--footer-muted) !important; }
        .border-theme { border-color: var(--border-color) !important; }

        .nav-link {
            position: relative;
            transition: all 0.3s ease;
            color: var(--text-color);
        }
        .nav-link:after {
            content: '';
            position: absolute;
            width: 0; height: 2px; bottom: -2px; left: 0;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }
        .nav-link:hover:after { width: 100%; }
        .nav-link:hover { color: var(--primary); }
        .nav-link.active {
            color: var(--primary) !important;
            font-weight: 600;
        }
        .nav-link.active:after {
            content: '';
            position: absolute;
            width: 100%; height: 2px; bottom: -2px; left: 0;
            background-color: var(--primary);
        }

        .hamburger span {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: var(--text-color) !important;
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -6px); }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .animate-on-scroll.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="tail-container">

<!-- Toast -->
<div id="copy-toast"
     class="fixed bottom-5 right-5 translate-y-[120%] opacity-0 z-[9999] transition-all duration-300 max-w-xs w-[90%] sm:w-full bg-white border border-stone-200 rounded-2xl shadow-xl">
    <div class="flex items-center p-4 gap-x-3">
        <div class="w-9 h-9 rounded-full bg-primary-light flex items-center justify-center text-primary shrink-0">
            <i class="fa-solid fa-check"></i>
        </div>
        <p class="text-sm font-medium text-stone-700 flex-1">Phone number copied to clipboard!</p>
        <button onclick="hideToast()" class="text-stone-400 hover:text-stone-700 transition shrink-0">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
</div>

<script src="siteconfig.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobile-menu');

function toggleMobileMenu() {
  hamburger.classList.toggle('active');
  mobileMenu.classList.toggle('hidden');
}
hamburger.addEventListener('click', toggleMobileMenu);

function isMobileDevice() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

async function handlePhoneCTA(phoneNumber) {
  if (isMobileDevice()) {
    window.location.href = `tel:${phoneNumber}`;
    return;
  }
  try {
    await navigator.clipboard.writeText(phoneNumber);
    showToast();
  } catch (err) {
    console.error('Clipboard copy failed:', err);
  }
}

const toast = document.getElementById('copy-toast');
function showToast() {
  toast.classList.remove('translate-y-[120%]', 'opacity-0');
  setTimeout(() => hideToast(), 2500);
}
function hideToast() {
  toast.classList.add('translate-y-[120%]', 'opacity-0');
}

let images = [];
let currentIndex = 0;

window.onload = function () {
  window.scrollTo(0, 0);
  const imgs = document.querySelectorAll("#galleryGrid img");
  images = Array.from(imgs).map(img => img.src);
};

function openLightbox(event, index) {
  event.preventDefault();
  currentIndex = index;
  const srcs = window.images && window.images.length ? window.images : images;
  document.getElementById("lightbox-img").src = srcs[currentIndex];
  const lightbox = document.getElementById("lightbox");
  lightbox.classList.remove("hidden");
  lightbox.classList.add("flex");
}
function closeLightbox() {
  const lightbox = document.getElementById("lightbox");
  lightbox.classList.add("hidden");
  lightbox.classList.remove("flex");
}
function nextImage() {
  const srcs = window.images && window.images.length ? window.images : images;
  currentIndex = (currentIndex + 1) % srcs.length;
  document.getElementById("lightbox-img").src = srcs[currentIndex];
}
function prevImage() {
  const srcs = window.images && window.images.length ? window.images : images;
  currentIndex = (currentIndex - 1 + srcs.length) % srcs.length;
  document.getElementById("lightbox-img").src = srcs[currentIndex];
}
document.getElementById("lightbox").addEventListener("click", function(e) {
  if (e.target.id === "lightbox") closeLightbox();
});
document.addEventListener("keydown", function(e) {
  if (document.getElementById("lightbox").classList.contains("hidden")) return;
  if (e.key === "ArrowRight") nextImage();
  if (e.key === "ArrowLeft") prevImage();
  if (e.key === "Escape") closeLightbox();
});

document.addEventListener("DOMContentLoaded", () => {
  setTimeout(() => {
    if (typeof Swiper !== "undefined") {
      new Swiper(".myTestimonialSwiper", {
        slidesPerView: 1,
        spaceBetween: 20,
        loop: true,
        navigation: { nextEl: ".next-btn", prevEl: ".prev-btn" },
        breakpoints: { 768: { slidesPerView: 2, spaceBetween: 28 } }
      });
    }
  }, 80);
});

function toggleFaq(button) {
  const content = button.nextElementSibling;
  const icon = button.querySelector('.faq-icon');
  document.querySelectorAll('.faq-content').forEach(item => {
    if (item !== content) {
      item.style.maxHeight = null;
      const otherIcon = item.previousElementSibling.querySelector('.faq-icon');
      if (otherIcon) otherIcon.textContent = '+';
    }
  });
  if (content.style.maxHeight) {
    content.style.maxHeight = null;
    icon.textContent = '+';
  } else {
    content.style.maxHeight = content.scrollHeight + "px";
    icon.textContent = '−';
  }
}
</script>

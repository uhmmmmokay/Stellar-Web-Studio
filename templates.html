<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Web Studio | Choose Your Website</title>
    <link rel="icon" type="image/svg+xml" href="IMAGES/favicon stellar web studio.svg">
    <meta name="description" content="Pick a professionally designed website template. Customized for your business — starting at $9.99.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        ink: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                        brand: {
                            DEFAULT: '#2563eb',
                            soft: '#eff6ff',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: Inter, system-ui, sans-serif; }
        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .reveal.in-view { opacity: 1; transform: translateY(0); }
        .reveal-delay-1 { transition-delay: 0.08s; }
        .reveal-delay-2 { transition-delay: 0.16s; }
    </style>
</head>
<body class="bg-ink-50 text-ink-900 antialiased min-h-screen">

<!-- Slim top bar -->
<div class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-ink-200">
    <div class="max-w-5xl mx-auto px-5 sm:px-6 h-14 flex items-center justify-between">
        <a href="index.html"
           class="inline-flex items-center gap-1.5 text-sm font-medium text-ink-600 hover:text-brand transition">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6"/>
            </svg>
            Back
        </a>
        <div class="flex items-center gap-2">
            <img src="IMAGES/stellar web studio.svg" alt="" class="h-6 w-auto">
            <span class="text-sm font-semibold text-ink-900 tracking-tight hidden sm:inline">Stellar Web Studio</span>
        </div>
        <span class="w-14" aria-hidden="true"></span><!-- spacer to center logo -->
    </div>
</div>

<main class="max-w-5xl mx-auto px-5 sm:px-6 py-10 sm:py-14">

    <div class="text-center mb-10 sm:mb-12 reveal">
        <p class="text-sm font-semibold text-brand mb-2">Step 1 of 2</p>
        <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-ink-900">
            Pick a design
        </h1>
        <p class="mt-2 text-ink-700 text-base sm:text-lg max-w-md mx-auto">
            Choose a template. We’ll customize it for your business.
        </p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-8">

        <a href="landscape_template_details.html"
           class="group block overflow-hidden rounded-2xl border border-ink-200 bg-white p-4 sm:p-5
                  shadow-sm transition hover:-translate-y-1 hover:shadow-lg hover:shadow-ink-900/5 hover:border-brand/30 reveal reveal-delay-1">
            <div class="bg-ink-100 aspect-[16/10] overflow-hidden rounded-xl mb-4">
                <img src="landscape site/landscape_hero.png"
                     alt="Landscape Template"
                     class="h-full w-full object-contain object-top transition duration-300 group-hover:scale-[1.02]">
            </div>
            <div class="flex items-center justify-between gap-3">
                <div>
                    <h2 class="text-base font-semibold text-ink-900">Landscape</h2>
                    <p class="text-sm text-ink-600 mt-0.5">Outdoor & service businesses</p>
                </div>
                <span class="text-base font-bold text-ink-900 shrink-0">$9.99</span>
            </div>
            <span class="mt-4 flex items-center justify-center gap-1.5 rounded-lg bg-brand px-4 py-2.5 text-sm font-semibold text-white transition group-hover:bg-blue-700">
                View Details
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
            </span>
        </a>

        <a href="business_template_details.html"
           class="group block overflow-hidden rounded-2xl border border-ink-200 bg-white p-4 sm:p-5
                  shadow-sm transition hover:-translate-y-1 hover:shadow-lg hover:shadow-ink-900/5 hover:border-brand/30 reveal reveal-delay-2">
            <div class="bg-ink-100 aspect-[16/10] overflow-hidden rounded-xl mb-4">
                <img src="business site/hero.png"
                     alt="Business Template"
                     class="h-full w-full object-contain object-top transition duration-300 group-hover:scale-[1.02]">
            </div>
            <div class="flex items-center justify-between gap-3">
                <div>
                    <h2 class="text-base font-semibold text-ink-900">Business</h2>
                    <p class="text-sm text-ink-600 mt-0.5">Pros, consultants & local brands</p>
                </div>
                <span class="text-base font-bold text-ink-900 shrink-0">$9.99</span>
            </div>
            <span class="mt-4 flex items-center justify-center gap-1.5 rounded-lg bg-brand px-4 py-2.5 text-sm font-semibold text-white transition group-hover:bg-blue-700">
                View Details
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
            </span>
        </a>

    </div>

    <p class="mt-10 text-center text-sm text-ink-600 reveal">
        Free hosting · Copywriting included · Ready fast
    </p>

</main>

<script>
(function () {
    const els = document.querySelectorAll('.reveal');
    if (!els.length) return;
    const observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (entry.isIntersecting) entry.target.classList.add('in-view');
        });
    }, { threshold: 0.1 });
    els.forEach(function (el) { observer.observe(el); });
})();
</script>
</body>
</html>
